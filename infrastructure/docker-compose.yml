services:
  n8n:
    image: n8nio/n8n:1.60.0
    restart: unless-stopped
    env_file:
      - ../.env.n8n
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 1g
    pids_limit: 200
    security_opt:
      - no-new-privileges:true

volumes:
  n8n_data:
