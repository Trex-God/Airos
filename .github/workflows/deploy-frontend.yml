name: Deploy Frontend

# Add these in GitHub Settings -> Secrets and variables -> Actions:
# GCP_SA_KEY: Base64-encoded contents of gcp-key.json
# VERCEL_TOKEN
# VERCEL_ORG_ID
# VERCEL_PROJECT_ID

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache frontend node_modules
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-

      - name: Install dependencies
        if: steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --frozen-lockfile
        working-directory: ./frontend

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: ./frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: ./frontend

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: vercel-deployment
        uses: amondnet/vercel-action@v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: --prod

      - name: Print deployment URL
        run: |
          echo "Deployment URL: ${{ steps.vercel-deployment.outputs.preview-url }}"
